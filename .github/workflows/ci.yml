name: CI

on:
  push:
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build Breakout.sln
        run: msbuild Breakout.sln /m /p:Configuration=${{ matrix.configuration }} /p:Platform=x64
